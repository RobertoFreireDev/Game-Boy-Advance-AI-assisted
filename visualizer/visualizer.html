<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBA Node Visualizer</title>
<!--
  AI work visualizer (CLAUDE.md §10). One file, no dependencies, works from file://.
  READ-ONLY: controls only change how you look at the data. Data comes from data.js
  (written by tools/bundle.py). This file is one of the "four mirrors": every node type
  has a preview function in PREVIEW below.
-->
<style>
:root {
  --bg: #15171c; --panel: #1d2027; --panel2: #252933; --line: #323745; --text: #e4e6eb;
  --dim: #9aa1b1; --accent: #6cb4ff; --accent2: #ffcf5c; --bad: #ff6b6b; --good: #5fd38d; --warn: #f0b04a;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
button, select, input { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: #2d4a6b; border-color: var(--accent); }
code, .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
header { display: flex; align-items: center; gap: 16px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0; letter-spacing: .5px; }
header .meta { color: var(--dim); }
header .hint { margin-left: auto; color: var(--accent2); font-weight: 600; }
.pill { padding: 2px 9px; border-radius: 99px; font-weight: 600; font-size: 12px; }
.pill.ok { background: #1f4630; color: var(--good); }
.pill.bad { background: #4a1f24; color: var(--bad); cursor: pointer; }
#banner { display: none; background: #3a1d22; border-bottom: 1px solid #6b2a33; padding: 8px 14px; max-height: 30vh; overflow: auto; }
#banner.show { display: block; }
#banner li { color: #ffb3b3; }
#banner .w li { color: #f3d29a; }
main { flex: 1; display: grid; grid-template-columns: 300px 1fr 360px; min-height: 0; }
aside, #center { overflow: auto; min-height: 0; }
aside { background: var(--panel); }
#left { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
#right { border-left: 1px solid var(--line); padding: 12px 14px; }
.sec { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.sec h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); margin: 0 0 8px; }
#search { width: 100%; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); background: transparent; color: var(--dim); }
.chip.on { background: #2d4a6b; color: var(--text); border-color: var(--accent); }
#list { max-height: 38vh; overflow: auto; }
.row { display: flex; align-items: center; gap: 7px; padding: 3px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.row:hover { background: var(--panel2); }
.row.sel { background: #2d4a6b; }
.row .ic { width: 18px; text-align: center; }
.row .nm { overflow: hidden; text-overflow: ellipsis; }
.row .id { color: var(--dim); font-size: 11px; margin-left: auto; font-family: Consolas, monospace; }
#tree { flex: 1; overflow: auto; }
.tnode { padding-left: 14px; }
.tlabel { display: flex; align-items: center; gap: 4px; padding: 2px 4px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.tlabel:hover { background: var(--panel2); }
.tlabel.sel { background: #2d4a6b; }
.tog { width: 14px; color: var(--dim); text-align: center; flex: none; }
.tlabel .sub { color: var(--dim); font-size: 11px; }
#center { padding: 14px 18px; }
.empty { color: var(--dim); padding: 40px; text-align: center; font-size: 15px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 14px; }
.card h3 { margin: 0 0 10px; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.toolbar label { color: var(--dim); }
.frames { display: flex; flex-wrap: wrap; gap: 12px; }
.frame { text-align: center; }
.frame .cap { color: var(--dim); font-size: 11px; margin-top: 3px; }
.frame canvas, .stage canvas { background: repeating-conic-gradient(#2a2e38 0% 25%, #22252d 0% 50%) 50% / 16px 16px; border: 1px solid var(--line); }
.frame.cur canvas { outline: 2px solid var(--accent2); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.swatch { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.swatch .c { height: 46px; }
.swatch .t { padding: 4px 7px; font-size: 11px; }
.swatch .t b { color: var(--accent2); }
.badge { display: inline-block; font-size: 10px; padding: 0 6px; border-radius: 99px; margin: 1px; background: #333a48; color: var(--dim); }
.badge.solid { background: #5a2a2a; color: #ffb0b0; }
.badge.one_way { background: #2a3f5a; color: #a8d0ff; }
.badge.hazard { background: #5a4520; color: #ffd28a; }
.badge.ladder { background: #24502f; color: #9ff0b5; }
.badge.default { background: #2c3140; color: #8b93a6; }
.badge.set { background: #2d4a6b; color: #cfe5ff; }
.badge.over { background: #5a3d16; color: #ffd28a; }
.pname { font-size: 18px; margin: 0 0 2px; }
.pid { color: var(--dim); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.notes { background: #23324a; border-left: 3px solid var(--accent); padding: 9px 11px; border-radius: 6px; margin: 12px 0; font-size: 14px; line-height: 1.5; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; margin: 4px 0; }
.kv > .k { color: var(--dim); }
.kv > .v { word-break: break-word; }
.prop-sec { margin-top: 14px; }
.prop-sec > h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); }
.bhv { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; margin-bottom: 7px; background: var(--panel2); }
.bhv .bn { font-weight: 700; color: var(--accent2); }
.bhv .bd { color: var(--dim); font-size: 12px; margin: 2px 0 5px; }
ul.acts { margin: 2px 0 2px 0; padding-left: 18px; }
ul.acts li { margin: 1px 0; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid #0006; vertical-align: -2px; margin-right: 4px; }
details summary { cursor: pointer; color: var(--dim); }
pre.raw { background: #101216; padding: 8px; border-radius: 6px; overflow: auto; max-height: 50vh; font-size: 11px; }
table.grid { border-collapse: collapse; font-family: Consolas, monospace; font-size: 11px; }
table.grid td, table.grid th { border: 1px solid var(--line); padding: 1px 5px; text-align: center; min-width: 30px; }
table.grid th { color: var(--dim); position: sticky; top: 0; background: var(--panel); }
table.grid tr.cur td { background: #3c3416; }
table.grid td.hold { color: #6b7385; }
table.grid td.rest { color: #4a5060; }
.tracker { max-height: 360px; overflow: auto; }
.steps td { padding: 2px 8px; }
.inst-table td { padding: 2px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.stage { overflow: auto; max-width: 100%; }
.small { font-size: 11px; color: var(--dim); }
.warnline { color: var(--warn); }
kbd { background: #333a48; border-radius: 4px; padding: 0 5px; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1 id="title">GBA Node Visualizer</h1>
  <span class="meta" id="gen"></span>
  <span id="status"></span>
  <span class="meta" id="counts"></span>
  <span class="hint">Read-only — ask the AI to change anything.</span>
</header>
<div id="banner"></div>
<main>
  <aside id="left">
    <div class="sec">
      <h2>1 · Nodes</h2>
      <input id="search" placeholder="Search name, id, type, tag…" autocomplete="off">
      <div class="chips" id="kindchips"></div>
      <div class="chips" id="typechips" style="margin-top:4px"></div>
    </div>
    <div class="sec" id="list"></div>
    <div class="sec" style="border-bottom:none"><h2>2 · Tree</h2></div>
    <div id="tree"></div>
  </aside>
  <section id="center"><div class="empty">Pick a node on the left.</div></section>
  <aside id="right"><div class="empty">Properties appear here.</div></aside>
</main>
<script src="data.js"></script>
<script>
"use strict";
// ======================================================================================
// Data
// ======================================================================================
const D = window.GAME_DATA;
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}

if (!D) {
  document.body.innerHTML = '<div class="empty" style="margin-top:20vh">No data yet.<br><br><b>Run view.bat</b> (it writes visualizer/data.js and opens this page).</div>';
  throw new Error("data.js missing");
}

const NODES = D.nodes || {};
const INDEX = D.index || [];
const IDX = {};
INDEX.forEach(e => { IDX[e.id] = e; });
const CAT = (D.catalog || {});
const BEHAVIORS = CAT.behaviors || {};
const ACTIONS = CAT.actions || {};
const ENGINE = D.engine || {};
const DERIVED = Object.assign({ dialogs: {}, menus: {}, upgrades: {}, upgrade_card: { icon_dx: 3, tag_dx: 15, text_w: 22 } }, D.derived || {});
const VARS = ((D.game || {}).variables || []);
const ACTOR_TYPES = ["player", "enemy", "npc", "prop", "platform", "pickup", "trigger"];

const ICONS = {
  intro: "🎬", title: "🏷️", level: "🗺️", inventory: "🎒", cutscene: "🎞️", game_over: "💀", credits: "📜",
  palette: "🎨", sprite: "👾", tileset: "🧱", tilemap: "🗾", font: "🔤", icon: "🖼️", sfx: "🔊", music: "🎵",
  animation: "🎞", particle: "✨", body: "🧍", player: "🕹️", enemy: "👹", npc: "🧙", prop: "🌳", platform: "🛗",
  pickup: "🪙", trigger: "⚑", hud: "📊", menu: "📋", dialog: "💬", upgrade: "⬆️"
};
const typeOf = id => (IDX[id] || {}).type;
const kindOf = id => (IDX[id] || {}).kind;
const iconOf = id => kindOf(id) === "scene" ? (ICONS[typeOf(id)] || "🎬") : (typeOf(id) === "menu" ? "📋" : ICONS[typeOf(id)] || "•");
const nameOf = id => (NODES[id] && NODES[id].name) || id;

// "Used by": every node that mentions this id anywhere in its JSON.
const USED_BY = {};
(function computeUsedBy() {
  for (const [id, n] of Object.entries(NODES)) {
    const seen = new Set();
    (function walk(v, key) {
      if (typeof v === "string") { if (v !== id && IDX[v] && key !== "id") seen.add(v); }
      else if (Array.isArray(v)) v.forEach(x => walk(x, key));
      else if (v && typeof v === "object") for (const [k, x] of Object.entries(v)) walk(x, k);
    })(n, "");
    for (const t of seen) (USED_BY[t] = USED_BY[t] || []).push(id);
  }
})();

// ======================================================================================
// Pixels: palettes are quantized to 15-bit color exactly like the GBA.
// ======================================================================================
function q15(hex) {
  if (typeof hex !== "string" || !/^#[0-9a-f]{6}$/i.test(hex)) return [255, 0, 255];
  return [1, 3, 5].map(i => { const c5 = parseInt(hex.substr(i, 2), 16) >> 3; return (c5 << 3) | (c5 >> 2); });
}
function bgr555(hex) {
  const v = [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16) >> 3);
  return v[0] | (v[1] << 5) | (v[2] << 10);
}
const rgbCss = c => `rgb(${c[0]},${c[1]},${c[2]})`;
function palColors(palId) {
  const p = NODES[palId];
  const cols = (p && Array.isArray(p.colors)) ? p.colors.map(q15) : [];
  while (cols.length < 16) cols.push([255, 0, 255]);
  return cols;
}
const PIX = ".123456789abcdef";
const _pixCache = new Map();
// Canvas (1x) of a pixel-string image. paper = palette index to paint transparent pixels with.
function pixelsCanvas(rows, palId, paper) {
  const key = palId + "|" + paper + "|" + (rows || []).join("/");
  if (_pixCache.has(key)) return _pixCache.get(key);
  rows = Array.isArray(rows) ? rows : [];
  const hgt = rows.length, wid = Math.max(1, ...rows.map(r => (r || "").length));
  const c = document.createElement("canvas");
  c.width = wid; c.height = Math.max(1, hgt);
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(c.width, c.height);
  const cols = palColors(palId);
  for (let y = 0; y < hgt; y++) for (let x = 0; x < (rows[y] || "").length; x++) {
    let i = PIX.indexOf(rows[y][x]);
    if (i <= 0) { if (paper === undefined || paper === null) continue; i = paper; }
    const o = (y * c.width + x) * 4, col = cols[i] || [255, 0, 255];
    img.data[o] = col[0]; img.data[o + 1] = col[1]; img.data[o + 2] = col[2]; img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  _pixCache.set(key, c);
  return c;
}
function frameCanvas(spriteId, frame) {
  const s = NODES[spriteId];
  if (!s || !s.frames || !s.frames[frame]) return null;
  return pixelsCanvas(s.frames[frame], s.palette);
}
// Draw a (1x) canvas at x,y with flips; ctx already scaled by zoom if needed.
function blit(ctx, src, x, y, flipX, flipY) {
  if (!src) return;
  ctx.save();
  ctx.translate(x + (flipX ? src.width : 0), y + (flipY ? src.height : 0));
  ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
  ctx.drawImage(src, 0, 0);
  ctx.restore();
}
function zoomCanvas(w, hgt, zoom) {
  const c = h("canvas", { width: w * zoom, height: hgt * zoom });
  c.style.width = (w * zoom) + "px"; c.style.height = (hgt * zoom) + "px";
  const ctx = c.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.scale(zoom, zoom);
  return [c, ctx];
}
function bigImage(src, zoom, grid) {
  const [c, ctx] = zoomCanvas(src.width, src.height, zoom);
  ctx.drawImage(src, 0, 0);
  if (grid) drawGrid(ctx, src.width, src.height, 1, zoom, "rgba(255,255,255,.12)");
  return c;
}
function drawGrid(ctx, w, hgt, step, zoom, color) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = 1 / zoom;
  ctx.beginPath();
  for (let x = 0; x <= w; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, hgt); }
  for (let y = 0; y <= hgt; y += step) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
  ctx.stroke(); ctx.restore();
}

// ======================================================================================
// Animation timing (same rules as src/engine/anim.c: 1 tick = 1/60 s).
// ======================================================================================
function animAt(animId, tick) {
  const a = NODES[animId];
  if (!a || !Array.isArray(a.frames) || !a.frames.length) return null;
  const total = a.frames.reduce((s, f) => s + Math.max(1, f.ticks | 0), 0);
  let t = a.loop === false ? Math.min(tick, total - 1) : tick % total;
  for (let i = 0; i < a.frames.length; i++) {
    const d = Math.max(1, a.frames[i].ticks | 0);
    if (t < d) return { index: i, frame: a.frames[i], sprite: a.sprite };
    t -= d;
  }
  return { index: a.frames.length - 1, frame: a.frames[a.frames.length - 1], sprite: a.sprite };
}
function bodyAnim(bodyId, slot) {
  const b = NODES[bodyId];
  if (!b || !b.animations) return null;
  const fallback = { run: "walk", walk: "run", fall: "jump", die: "hurt",
    idle_up: "idle", idle_down: "idle", walk_up: "walk", walk_down: "walk", attack_up: "attack", attack_down: "attack" };
  return b.animations[slot] || b.animations[fallback[slot]] || b.animations[fallback[fallback[slot]]] ||
    b.animations[b.default_animation] || null;
}
// Slots seen from above / below (*_up, *_down) are never mirrored, like sprites.c.
const isVerticalSlot = slot => /_(up|down)$/.test(slot || "");
// Draw an actor body like sprites.c: the origin mirrors with the art when flipped.
function drawBody(ctx, bodyId, slot, wx, wy, tick, facingLeft) {
  const b = NODES[bodyId];
  const an = bodyAnim(bodyId, slot);
  const st = an && animAt(an, tick);
  if (!b || !st) return null;
  const spr = NODES[st.sprite];
  if (!spr) return null;
  const fx = !!st.frame.flip_x !== (!!facingLeft && !isVerticalSlot(slot)), fy = !!st.frame.flip_y;
  const o = b.origin || [0, 0];
  const ox = fx ? spr.width - o[0] : o[0], oy = fy ? spr.height - o[1] : o[1];
  blit(ctx, frameCanvas(st.sprite, st.frame.frame), wx - ox, wy - oy, fx, fy);
  return { x: wx - ox, y: wy - oy, w: spr.width, h: spr.height };
}

// Global clock: one shared 60 Hz tick for every live preview. Space = play / pause.
const clock = { tick: 0, playing: true, last: performance.now(), acc: 0, views: [] };
function tickLoop(now) {
  const dt = now - clock.last; clock.last = now;
  if (clock.playing) {
    clock.acc += dt;
    const n = Math.floor(clock.acc / (1000 / 60));
    if (n > 0) { clock.acc -= n * 1000 / 60; clock.tick += Math.min(n, 10); clock.views.forEach(v => v(clock.tick, n)); }
  }
  requestAnimationFrame(tickLoop);
}
requestAnimationFrame(tickLoop);
function live(fn) { clock.views.push(fn); fn(clock.tick, 0); }
function playButtons(extra) {
  const b = h("button", { onclick: () => { clock.playing = !clock.playing; b.textContent = clock.playing ? "⏸ Pause" : "▶ Play"; } }, clock.playing ? "⏸ Pause" : "▶ Play");
  const s = h("button", { onclick: () => { clock.playing = false; b.textContent = "▶ Play"; clock.tick++; clock.views.forEach(v => v(clock.tick, 1)); } }, "⏭ Step");
  return h("span", { class: "toolbar", style: "margin:0" }, b, s, extra || null);
}

// ======================================================================================
// Text, boxes and UI screens (same layout as src/engine/ui.c and tools/common.py)
// ======================================================================================
function glyphRows(fontId, ch) {
  const f = NODES[fontId];
  if (!f || !f.glyphs) return null;
  return f.glyphs[ch] || f.glyphs[ch.toUpperCase()] || null;
}
function drawText(ctx, fontId, text, tx, ty, paper) {
  const f = NODES[fontId];
  if (!f) return;
  let x = tx, y = ty;
  for (const ch of String(text)) {
    if (ch === "\n") { y++; x = tx; continue; }
    const rows = glyphRows(fontId, ch);
    if (rows) ctx.drawImage(pixelsCanvas(rows, f.palette, paper), x * 8, y * 8);
    else if (paper !== undefined && paper !== null) { ctx.fillStyle = rgbCss(palColors(f.palette)[paper]); ctx.fillRect(x * 8, y * 8, 8, 8); }
    x++;
  }
}
function frameTile(t, paper, border) {
  const left = t % 3 === 0, right = t % 3 === 2, top = Math.floor(t / 3) === 0, bottom = Math.floor(t / 3) === 2;
  const rows = [];
  for (let y = 0; y < 8; y++) {
    let r = "";
    for (let x = 0; x < 8; x++) {
      const edge = (left && x < 2) || (right && x > 5) || (top && y < 2) || (bottom && y > 5);
      const cut = (left || right) && (top || bottom) && x === (left ? 0 : 7) && y === (top ? 0 : 7);
      r += cut ? "." : PIX[edge ? border : paper];
    }
    rows.push(r);
  }
  return rows;
}
function drawBox(ctx, fontId, box) {
  const f = NODES[fontId];
  if (!f || !box) return;
  const bx = box.x >> 3, by = box.y >> 3, bw = box.w >> 3, bh = box.h >> 3;
  const paper = box.paper === undefined ? 1 : box.paper, border = box.border === undefined ? 2 : box.border;
  for (let j = 0; j < bh; j++) for (let i = 0; i < bw; i++) {
    const row = j === 0 ? 0 : j === bh - 1 ? 2 : 1, col = i === 0 ? 0 : i === bw - 1 ? 2 : 1;
    ctx.drawImage(pixelsCanvas(frameTile(row * 3 + col, paper, border), f.palette), (bx + i) * 8, (by + j) * 8);
  }
}
function drawIcon(ctx, iconId, tx, ty, paper, paperPal) {
  const ic = NODES[iconId];
  if (!ic) return;
  const usePaper = paper !== undefined && paper !== null && ic.palette === paperPal;
  ctx.drawImage(pixelsCanvas(ic.pixels, ic.palette, usePaper ? paper : undefined), tx * 8, ty * 8);
}
function varInitial(name) { const v = VARS.find(v => v.name === name); return v ? (v.initial === true ? 1 : v.initial === false ? 0 : v.initial) : 0; }
// {var} -> its value, {var:02} -> at least 2 digits (like ui.c). get(name) returns the value.
function fillText(text, get) {
  get = get || varInitial;
  return String(text || "").replace(/\{(\w+)(:02)?\}/g, (m, v, pad) => { const s = String(get(v)); return pad && s.length < 2 ? "0" + s : s; });
}
function drawHud(ctx, hudId, values) {
  const hd = NODES[hudId];

// ---- scenes ------------------------------------------------------------------------
function sceneLayout(sc) {
  const insts = (sc.instances || []).map((inst, i) => ({ ...inst, index: i, node: NODES[inst.object], type: typeOf(inst.object) }));
  const maps = insts.filter(i => i.type === "tilemap" && i.node);

  const f = insts.find(i => i.id === cam.follow) || insts.find(i => i.type && ACTOR_TYPES.includes(i.type) && i.node && (i.node.logic || []).some(l => l.behavior === "camera_target"));
  if (f) { cx = (f.x || 0) - 120; cy = (f.y || 0) - 88; }

}
function drawScene(ctx, sc, L, tick, ov, layersOnScreen) {

      if (ov.zones) { ctx.fillStyle = "rgba(255,207,92,.22)"; ctx.fillRect(x, y, z.w, z.h); ctx.strokeStyle = "#ffcf5c"; ctx.lineWidth = 1 / ov.zoom; ctx.strokeRect(x, y, z.w, z.h); }
      hits.push({ inst: i, x, y, w: z.w, h: z.h });

    }
    const r = drawBody(ctx, i.node.body, (NODES[i.node.body] || {}).default_animation || "idle", x, y, tick, false);
    if (r) hits.push({ inst: i, ...r });
    const b = NODES[i.node.body] || {};
    if (ov.hitbox && b.hitbox) { ctx.strokeStyle = "#ff4d6d"; ctx.lineWidth = 1 / ov.zoom; ctx.strokeRect(x + b.hitbox.x, y + b.hitbox.y, b.hitbox.w, b.hitbox.h); }

    h("div", { class: "small" }, "Blue frame = what the 240×160 screen shows when the scene starts" + (cam.follow ? ` (following '${cam.follow}')` : "") + ". HUD/menus are drawn inside it.")),

    h("div", { class: "k" }, "actions"), h("div", {}, actionList(sc.on_start)))),

// ======================================================================================
// Left sidebar: list + tree
