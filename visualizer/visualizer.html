<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBA Node Visualizer</title>
<!--
  AI work visualizer (CLAUDE.md §10). One file, no dependencies, works from file://.
  READ-ONLY: controls only change how you look at the data. Data comes from data.js
  (written by tools/bundle.py). This file is one of the "four mirrors": every node type
  has a preview function in PREVIEW below.
-->
<style>
:root {
  --bg: #15171c; --panel: #1d2027; --panel2: #252933; --line: #323745; --text: #e4e6eb;
  --dim: #9aa1b1; --accent: #6cb4ff; --accent2: #ffcf5c; --bad: #ff6b6b; --good: #5fd38d; --warn: #f0b04a;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
button, select, input { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: #2d4a6b; border-color: var(--accent); }
code, .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
header { display: flex; align-items: center; gap: 16px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0; letter-spacing: .5px; }
header .meta { color: var(--dim); }
header .hint { margin-left: auto; color: var(--accent2); font-weight: 600; }
.pill { padding: 2px 9px; border-radius: 99px; font-weight: 600; font-size: 12px; }
.pill.ok { background: #1f4630; color: var(--good); }
.pill.bad { background: #4a1f24; color: var(--bad); cursor: pointer; }
#banner { display: none; background: #3a1d22; border-bottom: 1px solid #6b2a33; padding: 8px 14px; max-height: 30vh; overflow: auto; }
#banner.show { display: block; }
#banner li { color: #ffb3b3; }
#banner .w li { color: #f3d29a; }
main { flex: 1; display: grid; grid-template-columns: var(--lw, 300px) 1fr var(--rw, 360px); min-height: 0; }
main.lc { --lw: 30px; }
main.rc { --rw: 30px; }
aside, #center { overflow: auto; min-height: 0; }
aside { background: var(--panel); display: flex; flex-direction: column; }
#left { border-right: 1px solid var(--line); }
#right { border-left: 1px solid var(--line); }
#props { padding: 12px 14px; overflow: auto; flex: 1; min-height: 0; }
/* Sidebar head: title + collapse button. A collapsed sidebar shrinks to a thin rail. */
.side-head { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-bottom: 1px solid var(--line); flex: none; }
.side-head .st { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); font-weight: 700; flex: 1; }
.side-btn { padding: 0 7px; line-height: 20px; color: var(--dim); }
#right .side-head { flex-direction: row-reverse; }
aside.collapsed { overflow: hidden; cursor: pointer; }
aside.collapsed > :not(.side-head) { display: none; }
aside.collapsed .side-head { flex-direction: column; border-bottom: none; padding: 6px 0; height: 100%; }
aside.collapsed .side-head .st { writing-mode: vertical-rl; flex: none; }
aside.collapsed:hover { background: var(--panel2); }
.sec { padding: 10px 12px; border-bottom: 1px solid var(--line); flex: none; }
.sec h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); margin: 0 0 8px; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 4px; }
.sec h2:hover { color: var(--text); }
.sec h2::before { content: "▾"; width: 12px; }
.sec.collapsed h2 { margin: 0; }
.sec.collapsed h2::before { content: "▸"; }
.sec.collapsed > :not(h2) { display: none; }
.sec.grow:not(.collapsed) { flex: 1; min-height: 0; display: flex; flex-direction: column; border-bottom: none; }
#left:has(#sec-tree.collapsed) #sec-nodes:not(.collapsed) { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#left:has(#sec-tree.collapsed) #list { max-height: none; flex: 1; }
#search { width: 100%; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); background: transparent; color: var(--dim); }
.chip.on { background: #2d4a6b; color: var(--text); border-color: var(--accent); }
#list { max-height: 38vh; overflow: auto; }
.row { display: flex; align-items: center; gap: 7px; padding: 3px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.row:hover { background: var(--panel2); }
.row.sel { background: #2d4a6b; }
.row .ic { width: 18px; text-align: center; }
.row .nm { overflow: hidden; text-overflow: ellipsis; }
.row .id { color: var(--dim); font-size: 11px; margin-left: auto; font-family: Consolas, monospace; }
#tree { flex: 1; overflow: auto; }
.tnode { padding-left: 14px; }
.tlabel { display: flex; align-items: center; gap: 4px; padding: 2px 4px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.tlabel:hover { background: var(--panel2); }
.tlabel.sel { background: #2d4a6b; }
.tog { width: 14px; color: var(--dim); text-align: center; flex: none; }
.tlabel .sub { color: var(--dim); font-size: 11px; }
#center { padding: 14px 18px; }
.empty { color: var(--dim); padding: 40px; text-align: center; font-size: 15px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 14px; }
.card h3 { margin: 0 0 10px; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.toolbar label { color: var(--dim); }
.frames { display: flex; flex-wrap: wrap; gap: 12px; }
.frame { text-align: center; }
.compass { display: grid; grid-template-columns: repeat(3, max-content); gap: 10px 14px; }
.frame .cap { color: var(--dim); font-size: 11px; margin-top: 3px; }
.frame canvas, .stage canvas { background: repeating-conic-gradient(#2a2e38 0% 25%, #22252d 0% 50%) 50% / 16px 16px; border: 1px solid var(--line); }
.frame.cur canvas { outline: 2px solid var(--accent2); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.swatch { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.swatch .c { height: 46px; }
.swatch .t { padding: 4px 7px; font-size: 11px; }
.swatch .t b { color: var(--accent2); }
.badge { display: inline-block; font-size: 10px; padding: 0 6px; border-radius: 99px; margin: 1px; background: #333a48; color: var(--dim); }
.badge.solid { background: #5a2a2a; color: #ffb0b0; }
.badge.one_way { background: #2a3f5a; color: #a8d0ff; }
.badge.hazard { background: #5a4520; color: #ffd28a; }
.badge.ladder { background: #24502f; color: #9ff0b5; }
.badge.default { background: #2c3140; color: #8b93a6; }
.badge.set { background: #2d4a6b; color: #cfe5ff; }
.badge.over { background: #5a3d16; color: #ffd28a; }
.pname { font-size: 18px; margin: 0 0 2px; }
.pid { color: var(--dim); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.notes { background: #23324a; border-left: 3px solid var(--accent); padding: 9px 11px; border-radius: 6px; margin: 12px 0; font-size: 14px; line-height: 1.5; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; margin: 4px 0; }
.kv > .k { color: var(--dim); }
.kv > .v { word-break: break-word; }
.prop-sec { margin-top: 14px; }
.prop-sec > h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); }
.bhv { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; margin-bottom: 7px; background: var(--panel2); }
.bhv .bn { font-weight: 700; color: var(--accent2); }
.bhv .bd { color: var(--dim); font-size: 12px; margin: 2px 0 5px; }
ul.acts { margin: 2px 0 2px 0; padding-left: 18px; }
ul.acts li { margin: 1px 0; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid #0006; vertical-align: -2px; margin-right: 4px; }
details summary { cursor: pointer; color: var(--dim); }
pre.raw { background: #101216; padding: 8px; border-radius: 6px; overflow: auto; max-height: 50vh; font-size: 11px; }
table.grid { border-collapse: collapse; font-family: Consolas, monospace; font-size: 11px; }
table.grid td, table.grid th { border: 1px solid var(--line); padding: 1px 5px; text-align: center; min-width: 30px; }
table.grid th { color: var(--dim); position: sticky; top: 0; background: var(--panel); }
table.grid tr.cur td { background: #3c3416; }
table.grid td.hold { color: #6b7385; }
table.grid td.rest { color: #4a5060; }
.tracker { max-height: 360px; overflow: auto; }
.steps td { padding: 2px 8px; }
.inst-table td { padding: 2px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.stage { overflow: auto; max-width: 100%; }
.small { font-size: 11px; color: var(--dim); }
.warnline { color: var(--warn); }
kbd { background: #333a48; border-radius: 4px; padding: 0 5px; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1 id="title">GBA Node Visualizer</h1>
  <span class="meta" id="gen"></span>
  <span id="status"></span>
  <span class="meta" id="counts"></span>
  <span class="hint">Read-only — ask the AI to change anything.</span>
</header>
<div id="banner"></div>
<main>
  <aside id="left">
    <div class="side-head"><span class="st">Browse</span><button class="side-btn" title="Collapse / expand this panel">◀</button></div>
    <div class="sec" id="sec-nodes">
      <h2 title="Collapse / expand">1 · Nodes</h2>
      <input id="search" placeholder="Search name, id, type, tag…" autocomplete="off">
      <div class="chips" id="kindchips"></div>
      <div class="chips" id="typechips" style="margin-top:4px"></div>
      <div id="list" style="margin-top:8px"></div>
    </div>
    <div class="sec grow" id="sec-tree">
      <h2 title="Collapse / expand">2 · Tree</h2>
      <div id="tree"></div>
    </div>
  </aside>
  <section id="center"><div class="empty">Pick a node on the left.</div></section>
  <aside id="right">
    <div class="side-head"><span class="st">Properties</span><button class="side-btn" title="Collapse / expand this panel">▶</button></div>
    <div id="props"><div class="empty">Properties appear here.</div></div>
  </aside>
</main>
<script src="data.js"></script>
<script>
"use strict";
// ======================================================================================
// Data
// ======================================================================================
const D = window.GAME_DATA;
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}

if (!D) {
  document.body.innerHTML = '<div class="empty" style="margin-top:20vh">No data yet.<br><br><b>Run view.bat</b> (it writes visualizer/data.js and opens this page).</div>';
  throw new Error("data.js missing");
}

const NODES = D.nodes || {};
const INDEX = D.index || [];
const IDX = {};
INDEX.forEach(e => { IDX[e.id] = e; });
const CAT = (D.catalog || {});
const BEHAVIORS = CAT.behaviors || {};
const ACTIONS = CAT.actions || {};
const ENGINE = D.engine || {};
const DERIVED = Object.assign({ dialogs: {}, menus: {}, upgrades: {}, upgrade_card: { icon_dx: 3, tag_dx: 15, text_w: 22 } }, D.derived || {});
const VARS = ((D.game || {}).variables || []);
const ACTOR_TYPES = ["player", "enemy", "npc", "prop", "platform", "pickup", "trigger"];

const ICONS = {
  intro: "🎬", title: "🏷️", level: "🗺️", inventory: "🎒", cutscene: "🎞️", game_over: "💀", credits: "📜",
  palette: "🎨", sprite: "👾", tileset: "🧱", tilemap: "🗾", font: "🔤", icon: "🖼️", sfx: "🔊", music: "🎵",
  animation: "🎞", particle: "✨", body: "🧍", player: "🕹️", enemy: "👹", npc: "🧙", prop: "🌳", platform: "🛗",
  pickup: "🪙", trigger: "⚑", hud: "📊", menu: "📋", dialog: "💬", upgrade: "⬆️", species: "🐾", move: "💥"
};
const typeOf = id => (IDX[id] || {}).type;
const kindOf = id => (IDX[id] || {}).kind;
const iconOf = id => kindOf(id) === "scene" ? (ICONS[typeOf(id)] || "🎬") : (typeOf(id) === "menu" ? "📋" : ICONS[typeOf(id)] || "•");
const nameOf = id => (NODES[id] && NODES[id].name) || id;

// "Used by": every node that mentions this id anywhere in its JSON.
const USED_BY = {};
(function computeUsedBy() {
  for (const [id, n] of Object.entries(NODES)) {
    const seen = new Set();
    (function walk(v, key) {
      if (typeof v === "string") { if (v !== id && IDX[v] && key !== "id") seen.add(v); }
      else if (Array.isArray(v)) v.forEach(x => walk(x, key));
      else if (v && typeof v === "object") for (const [k, x] of Object.entries(v)) walk(x, k);
    })(n, "");
    for (const t of seen) (USED_BY[t] = USED_BY[t] || []).push(id);
  }
})();
// Where game settings (nodes.json game.battle) name a node: id -> ["game.battle.sounds.hit", …].
const GAME_USES = {};
(function walk(v, path) {
  if (typeof v === "string") { if (IDX[v]) (GAME_USES[v] = GAME_USES[v] || []).push(path); }
  else if (v && typeof v === "object" && !Array.isArray(v)) for (const [k, x] of Object.entries(v)) walk(x, path + "." + k);
})((D.game || {}).battle, "game.battle");

// ======================================================================================
// Pixels: palettes are quantized to 15-bit color exactly like the GBA.
// ======================================================================================
function q15(hex) {
  if (typeof hex !== "string" || !/^#[0-9a-f]{6}$/i.test(hex)) return [255, 0, 255];
  return [1, 3, 5].map(i => { const c5 = parseInt(hex.substr(i, 2), 16) >> 3; return (c5 << 3) | (c5 >> 2); });
}
function bgr555(hex) {
  const v = [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16) >> 3);
  return v[0] | (v[1] << 5) | (v[2] << 10);
}
const rgbCss = c => `rgb(${c[0]},${c[1]},${c[2]})`;
// palId may be "pal_ui@2@#f8d038": that palette with color 2 changed (a menu text's letters, like
// the recolored copies codegen makes).
function palColors(palId) {
  const at = String(palId || "").split("@");
  const p = NODES[at[0]];
  const cols = (p && Array.isArray(p.colors)) ? p.colors.map(q15) : [];
  while (cols.length < 16) cols.push([255, 0, 255]);
  if (at.length === 3) cols[+at[1]] = q15(at[2]);
  return cols;
}
const PIX = ".123456789abcdef";
const _pixCache = new Map();
// Canvas (1x) of a pixel-string image. paper = palette index to paint transparent pixels with.
function pixelsCanvas(rows, palId, paper) {
  const key = palId + "|" + paper + "|" + (rows || []).join("/");
  if (_pixCache.has(key)) return _pixCache.get(key);
  rows = Array.isArray(rows) ? rows : [];
  const hgt = rows.length, wid = Math.max(1, ...rows.map(r => (r || "").length));
  const c = document.createElement("canvas");
  c.width = wid; c.height = Math.max(1, hgt);
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(c.width, c.height);
  const cols = palColors(palId);
  for (let y = 0; y < hgt; y++) for (let x = 0; x < (rows[y] || "").length; x++) {
    let i = PIX.indexOf(rows[y][x]);
    if (i <= 0) { if (paper === undefined || paper === null) continue; i = paper; }
    const o = (y * c.width + x) * 4, col = cols[i] || [255, 0, 255];
    img.data[o] = col[0]; img.data[o + 1] = col[1]; img.data[o + 2] = col[2]; img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  _pixCache.set(key, c);
  return c;
}
function frameCanvas(spriteId, frame, palOverride) {
  const s = NODES[spriteId];
  if (!s || !s.frames || !s.frames[frame]) return null;
  return pixelsCanvas(s.frames[frame], palOverride || s.palette);
}
// Draw a (1x) canvas at x,y with flips; ctx already scaled by zoom if needed.
function blit(ctx, src, x, y, flipX, flipY) {
  if (!src) return;
  ctx.save();
  ctx.translate(x + (flipX ? src.width : 0), y + (flipY ? src.height : 0));
  ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
  ctx.drawImage(src, 0, 0);
  ctx.restore();
}
function zoomCanvas(w, hgt, zoom) {
  const c = h("canvas", { width: w * zoom, height: hgt * zoom });
  c.style.width = (w * zoom) + "px"; c.style.height = (hgt * zoom) + "px";
  const ctx = c.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.scale(zoom, zoom);
  return [c, ctx];
}
function bigImage(src, zoom, grid) {
  const [c, ctx] = zoomCanvas(src.width, src.height, zoom);
  ctx.drawImage(src, 0, 0);
  if (grid) drawGrid(ctx, src.width, src.height, 1, zoom, "rgba(255,255,255,.12)");
  return c;
}
function drawGrid(ctx, w, hgt, step, zoom, color) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = 1 / zoom;
  ctx.beginPath();
  for (let x = 0; x <= w; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, hgt); }
  for (let y = 0; y <= hgt; y += step) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
  ctx.stroke(); ctx.restore();
}

// ======================================================================================
// Animation timing (same rules as src/engine/anim.c: 1 tick = 1/60 s).
// ======================================================================================
function animAt(animId, tick) {
  const a = NODES[animId];
  if (!a || !Array.isArray(a.frames) || !a.frames.length) return null;
  const total = a.frames.reduce((s, f) => s + Math.max(1, f.ticks | 0), 0);
  let t = a.loop === false ? Math.min(tick, total - 1) : tick % total;
  for (let i = 0; i < a.frames.length; i++) {
    const d = Math.max(1, a.frames[i].ticks | 0);
    if (t < d) return { index: i, frame: a.frames[i], sprite: a.sprite };
    t -= d;
  }
  return { index: a.frames.length - 1, frame: a.frames[a.frames.length - 1], sprite: a.sprite };
}
function bodyAnim(bodyId, slot) {
  const b = NODES[bodyId];
  if (!b || !b.animations) return null;
  const fallback = { run: "walk", walk: "run", fall: "jump", die: "hurt" };
  const fb = s => fallback[s] || (dirBase(s) !== s ? dirBase(s) : undefined);   // idle_up_left -> idle
  return b.animations[slot] || b.animations[fb(slot)] || b.animations[fb(fb(slot))] ||
    b.animations[b.default_animation] || null;
}
// The base animation of a directional slot (walk_down_left -> walk).
const dirBase = s => (s || "").replace(/_(up_right|up_left|down_right|down_left|up|down|left)$/, "");
// Slots drawn for one direction only (*_up, *_down and the *_left ones) are never mirrored, like sprites.c.
const isFixedSlot = slot => /_(up|down|left)$/.test(slot || "");
// The 8 ways an actor faces, as a 3x3 compass (null = the middle): slot suffix and (x, y) step.
const DIRS8 = [["up_left", -1, -1], ["up", 0, -1], ["up_right", 1, -1], ["left", -1, 0], null, ["right", 1, 0],
               ["down_left", -1, 1], ["down", 0, 1], ["down_right", 1, 1]];
// The slot a body plays for a base animation (idle / walk / attack) facing (x, y), and whether it is
// mirrored: like actor.iwram.c directional_slot. A left one without its art uses the right one
// mirrored; a diagonal without any, the side one (what `facing` picks from a standing start).
function dirSlot(bodyId, base, x, y) {
  const an = (NODES[bodyId] || {}).animations || {};
  const pick = s => ({ slot: s, mirror: x < 0 && !isFixedSlot(s) });
  if (x && y) {
    const v = (y < 0 ? "up_" : "down_");
    if (an[base + "_" + v + (x < 0 ? "left" : "right")]) return pick(base + "_" + v + (x < 0 ? "left" : "right"));
    if (x < 0 && an[base + "_" + v + "right"]) return pick(base + "_" + v + "right");
    y = 0;
  }
  if (!x) return pick(an[base + (y < 0 ? "_up" : "_down")] ? base + (y < 0 ? "_up" : "_down") : base);
  return pick(x < 0 && an[base + "_left"] ? base + "_left" : base);
}
// Draw an actor body like sprites.c: the origin mirrors with the art when flipped.
function drawBody(ctx, bodyId, slot, wx, wy, tick, facingLeft, palOverride) {
  const b = NODES[bodyId];
  const an = bodyAnim(bodyId, slot);
  const st = an && animAt(an, tick);
  if (!b || !st) return null;
  const spr = NODES[st.sprite];
  if (!spr) return null;
  const fx = !!st.frame.flip_x !== (!!facingLeft && !isFixedSlot(slot)), fy = !!st.frame.flip_y;
  const o = b.origin || [0, 0];

    h("span", { class: "ic" }, iconOf(e.id)), h("span", { class: "nm" }, nameOf(e.id)), h("span", { class: "id" }, e.id)));
}
function treeItem(key, label, kids, onclick, selected) {
  const open = ui.open.has(key);
  const wrap = h("div");
  const lab = h("div", { class: "tlabel" + (selected ? " sel" : "") },
    h("span", { class: "tog", onclick: ev => { ev.stopPropagation(); if (open) ui.open.delete(key); else ui.open.add(key); renderTree(); } }, kids.length ? (open ? "▾" : "▸") : ""),
    label);
  lab.addEventListener("click", () => { if (onclick) onclick(); else { if (open) ui.open.delete(key); else ui.open.add(key); renderTree(); } });
  wrap.append(lab);
  if (open && kids.length) wrap.append(h("div", { class: "tnode" }, kids.map(k => k())));
  return wrap;
}
function objectTree(id, path) {
  const kids = ((NODES[id] || {}).children || []).filter(k => IDX[k]);
  const key = path + "/" + id;
  return treeItem(key, [h("span", {}, iconOf(id)), " ", nameOf(id), h("span", { class: "sub" }, " " + id)], kids.map(k => () => objectTree(k, key)), () => select(id), ui.sel === id);
}
function renderTree() {
  const tree = $("#tree"); tree.innerHTML = "";
  const scenes = INDEX.filter(e => e.kind === "scene");
  const roots = INDEX.filter(e => e.kind === "object" && !e.parent);
  tree.append(treeItem("#scenes", [h("b", {}, "Scenes"), h("span", { class: "sub" }, " " + scenes.length)], scenes.map(s => () => {
    const insts = ((NODES[s.id] || {}).instances || []);
    return treeItem("s/" + s.id, [h("span", {}, iconOf(s.id)), " ", nameOf(s.id), h("span", { class: "sub" }, " " + s.id)],
      insts.map(i => () => h("div", { class: "tlabel" + (ui.sel === i.object ? " sel" : ""), onclick: () => select(i.object) }, h("span", { class: "tog" }), h("span", { class: "mono" }, i.id), h("span", { class: "sub" }, " → "), iconOf(i.object), " ", nameOf(i.object))),
      () => select(s.id), ui.sel === s.id);
  })));
  tree.append(treeItem("#objects", [h("b", {}, "Objects"), h("span", { class: "sub" }, " " + roots.length + " roots")], roots.map(r => () => objectTree(r.id, "o"))));
}
function expandTo(id) {
  // Open the object chain from its root, and every scene that places it.
  const chain = [];
  for (let cur = id; cur && IDX[cur]; cur = IDX[cur].parent) chain.unshift(cur);
  let key = "o";
  chain.forEach(c => { key = key + "/" + c; ui.open.add(key); });
  INDEX.filter(e => e.kind === "scene").forEach(s => { if (((NODES[s.id] || {}).instances || []).some(i => i.object === id || ((i.variants || {}).objects || []).includes(id))) ui.open.add("s/" + s.id); });
}

// ======================================================================================
// Selection
// ======================================================================================
function select(id, fromHash) {
  if (!IDX[id]) return;
  ui.sel = id;
  stopAllAudio();
  clock.views = [];
  if (!fromHash && location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
  expandTo(id);
  renderList(); renderTree(); renderProps(id);
  const center = $("#center"); center.innerHTML = "";
  const n = NODES[id], e = IDX[id];
  if (!n) { center.append(h("div", { class: "empty" }, "This node's file is missing or invalid; see the red banner.")); return; }
  try {
    const fn = e.kind === "scene" ? PREVIEW_scene : PREVIEW[e.type];
    const out = fn ? fn(id, n) : card("No preview for this type yet.");
    [].concat(out).filter(Boolean).forEach(x => center.append(x));
  } catch (err) {
    center.append(card("Preview error", h("div", { class: "warnline" }, "Could not draw this node: " + err.message + ". Ask the AI to check it.")));
    console.error(err);
  }
  const row = document.querySelector(`#list .row[data-id="${id}"]`);
  if (row) row.scrollIntoView({ block: "nearest" });
}

// ======================================================================================
// Header, banner, keyboard, boot
// ======================================================================================
function renderHeader() {
  const g = D.game || {};
  $("#title").textContent = (g.title || "Game") + " — node visualizer";
  document.title = (g.title || "Game") + " · visualizer";
  $("#gen").textContent = "data from " + (D.generated_at || "?");
  const v = D.validation || { ok: true, errors: [], warnings: [] };
  const st = $("#status");
  st.innerHTML = "";
  const banner = $("#banner");
  if (v.ok) st.append(h("span", { class: "pill ok" }, "✔ valid" + (v.warnings.length ? ` · ${v.warnings.length} warnings` : "")));
  else st.append(h("span", { class: "pill bad", onclick: () => banner.classList.toggle("show") }, `✖ ${v.errors.length} error(s)`));
  if (!v.ok || v.warnings.length) {
    banner.innerHTML = "";
    if (!v.ok) banner.append(h("b", {}, "Validation errors — the ROM will not build until the AI fixes these:"), h("ul", {}, v.errors.map(e => h("li", {}, e))));
    if (v.warnings.length) banner.append(h("div", { class: "w" }, h("b", {}, "Warnings:"), h("ul", {}, v.warnings.map(e => h("li", {}, e)))));
    if (!v.ok) banner.classList.add("show");
    if (v.ok) st.firstChild.style.cursor = "pointer", st.firstChild.onclick = () => banner.classList.toggle("show");
  }
  const scenes = INDEX.filter(e => e.kind === "scene").length;
  $("#counts").textContent = `${INDEX.length} nodes · ${scenes} scenes · ${INDEX.length - scenes} objects`;
}
$("#search").addEventListener("input", ev => { ui.search = ev.target.value; renderList(); });
// Collapsible sidebars and sections (view-only; remembered in this browser).
function loadFolds() { try { return JSON.parse(localStorage.getItem("gba_vis_folds") || "{}"); } catch (e) { return {}; } }
function saveFolds(f) { try { localStorage.setItem("gba_vis_folds", JSON.stringify(f)); } catch (e) { /* storage blocked: fine */ } }
const folds = loadFolds();
function setSide(side, closed) {
  const aside = $("#" + side), btn = aside.querySelector(".side-btn");
  aside.classList.toggle("collapsed", closed);
  $("main").classList.toggle(side === "left" ? "lc" : "rc", closed);
  btn.textContent = (side === "left") === closed ? "▶" : "◀";
  folds[side] = closed; saveFolds(folds);
}
["left", "right"].forEach(side => {
  const aside = $("#" + side);
  aside.querySelector(".side-btn").addEventListener("click", ev => { ev.stopPropagation(); setSide(side, !aside.classList.contains("collapsed")); });
  aside.addEventListener("click", () => { if (aside.classList.contains("collapsed")) setSide(side, false); });
  setSide(side, !!folds[side]);
});
document.querySelectorAll("#left .sec").forEach(sec => {
  sec.querySelector("h2").addEventListener("click", () => { const c = sec.classList.toggle("collapsed"); folds[sec.id] = c; saveFolds(folds); });
  sec.classList.toggle("collapsed", !!folds[sec.id]);
});
document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT") return;
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    const items = filtered(); if (!items.length) return;
    let i = items.findIndex(e => e.id === ui.sel);
    i = ev.key === "ArrowDown" ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1);
    select(items[i].id); ev.preventDefault();
  } else if (ev.key === " ") {
    clock.playing = !clock.playing;
    document.querySelectorAll("button").forEach(b => { if (b.textContent === "⏸ Pause" || b.textContent === "▶ Play") b.textContent = clock.playing ? "⏸ Pause" : "▶ Play"; });
    ev.preventDefault();
  }
});
window.addEventListener("hashchange", () => { const id = decodeURIComponent(location.hash.slice(1)); if (id && id !== ui.sel) select(id, true); });
renderHeader(); renderChips(); renderList(); renderTree();
const start = decodeURIComponent(location.hash.slice(1)) || (D.game || {}).start_scene || (INDEX[0] || {}).id;
if (start && IDX[start]) select(start, true);
</script>
</body>
